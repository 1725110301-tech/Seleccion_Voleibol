$def with (entrenamientos, entrenamiento, jugadores, error, mensaje, rama)
<h1>Pase de lista · ${rama.capitalize()}</h1>
$if error:
  <div class="alerta error">$error</div>
$if mensaje:
  <div class="alerta ok">$mensaje</div>
<form method="get" action="/entrenador/asistencia/lista" class="filtros">
  <label>Entrenamiento
    <select name="entrenamiento_id" onchange="this.form.submit()">
      <option value="">— Selecciona —</option>
      $for e in entrenamientos:
        <option value="$e.id" $('selected' if entrenamiento and entrenamiento.id == e.id else '')>$e.fecha · ${str(e.hora_inicio)[:5]}-${str(e.hora_fin)[:5]} ($e.tipo)</option>
    </select></label>
</form>
$if entrenamiento:
  <form method="post" action="/entrenador/asistencia/lista">
    <input type="hidden" name="entrenamiento_id" value="$entrenamiento.id">
    <div class="tabla-wrap"><table class="tabla">
    <thead><tr><th>#</th><th>Jugador</th><th>Presente</th><th>Falta</th><th>Justificada</th><th>Motivo (mín. 10 caracteres)</th></tr></thead>
    <tbody>
    $for j in jugadores:
      <tr>
        <td>$j.numero_playera</td><td>$j.nombre</td>
        <td><input type="radio" name="estado_$j.id" value="presente" required></td>
        <td><input type="radio" name="estado_$j.id" value="falta"></td>
        <td><input type="radio" name="estado_$j.id" value="justificada" class="just"></td>
        <td><input name="motivo_$j.id" maxlength="200" class="motivo" disabled></td>
      </tr>
    </tbody></table></div>
    <button class="btn principal">Guardar asistencia</button>
  </form>
